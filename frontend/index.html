<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/normalize.css" />
    <title>Input Page</title>
  </head>
  <body>
    <div id="navbar"></div>

    <div class="container">
      <div class="card fade-in" style="animation-delay: 0.1s" id="single">
        <h2>Single Transaction</h2>
        <form id="singleForm">
          <div class="field">
            <label>Type</label>
            <select id="type">
              <option value="PAYMENT">PAYMENT</option>
              <option value="TRANSFER">TRANSFER</option>
              <option value="CASH_OUT">CASH_OUT</option>
              <option value="DEBIT">DEBIT</option>
              <option value="CASH_IN">CASH_IN</option>
            </select>
          </div>
          <div class="field">
            <label>Amount</label>
            <input type="number" step="0.01" id="amount" value="1000.0" />
          </div>
          <div class="field">
            <label>Sender Balance Before</label>
            <input
              type="number"
              step="0.01"
              id="oldbalanceOrg"
              value="1000.0"
            />
          </div>
          <div class="field">
            <label>Sender Balance After</label>
            <input type="number" step="0.01" id="newbalanceOrig" value="0.0" />
          </div>
          <div class="field">
            <label>Receiver Balance Before</label>
            <input type="number" step="0.01" id="oldbalanceDest" value="0.0" />
          </div>
          <div class="field">
            <label>Receiver Balance After</label>
            <input type="number" step="0.01" id="newbalanceDest" value="0.0" />
          </div>
          <button class="btn" type="submit">Predict Single</button>
          <div id="singleRes" class="result-box"></div>
        </form>
      </div>
      <div class="card fade-in" style="animation-delay: 0.1s" id="batch">
        <h2>Batch Transaction</h2>
        <form id="batchForm">
          <div class="field">
            <input type="file" id="csvFile" accept=".csv" required />
          </div>
          <button class="btn" type="submit">Predict Batch</button>
        </form>
      </div>
      <div id="batchRes" class="result-box"></div>

      <script src="/static/js/navbar.js"></script>
      <script>
        loadNavbar();
      </script>
      <script src="/static/js/batch-input.js"></script>
      <script src="/static/js/single-input.js"></script>
    </div>
  </body>
</html>
