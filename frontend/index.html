<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/normalize.css" />
    <title>Input Page</title>
  </head>
  <body>
    <div id="navbar"></div>

    <script>
      async function loadNavbar() {
        const res = await fetch("/static/components/navbar.html");
        const html = await res.text();

        document.getElementById("navbar").innerHTML = html;
      }

      loadNavbar();
    </script>

    <div class="container">
      <div class="card" id="single">
        <h2>Single Transaction</h2>
        <form id="singleForm">
          <div class="field">
            <label>Type</label>
            <select id="type">
              <option value="PAYMENT">PAYMENT</option>
              <option value="TRANSFER">TRANSFER</option>
              <option value="CASH_OUT">CASH_OUT</option>
              <option value="DEBIT">DEBIT</option>
              <option value="CASH_IN">CASH_IN</option>
            </select>
          </div>
          <div class="field">
            <label>Amount</label>
            <input type="number" step="0.01" id="amount" value="1000.0" />
          </div>
          <div class="field">
            <label>Sender Balance Before</label>
            <input
              type="number"
              step="0.01"
              id="oldbalanceOrg"
              value="1000.0"
            />
          </div>
          <div class="field">
            <label>Sender Balance After</label>
            <input type="number" step="0.01" id="newbalanceOrig" value="0.0" />
          </div>
          <div class="field">
            <label>Receiver Balance Before</label>
            <input type="number" step="0.01" id="oldbalanceDest" value="0.0" />
          </div>
          <div class="field">
            <label>Receiver Balance After</label>
            <input type="number" step="0.01" id="newbalanceDest" value="0.0" />
          </div>
          <button class="btn" type="submit">Predict Single</button>
          <div id="singleRes" class="result-box"></div>
        </form>
      </div>
      <div class="card" id="batch">
        <h2>Batch Transaction</h2>
        <form id="batchForm">
          <div class="field">
            <input type="file" id="csvFile" accept=".csv" required />
          </div>
          <button class="btn" type="submit">Predict Batch</button>
        </form>
      </div>
      <div id="batchRes" class="result-box"></div>
      <script>
        document.getElementById("singleForm").onsubmit = async (e) => {
          e.preventDefault();

          const payload = {
            type: document.getElementById("type").value,
            amount: Number(document.getElementById("amount").value),
            oldbalanceOrg: Number(
              document.getElementById("oldbalanceOrg").value,
            ),
            newbalanceOrig: Number(
              document.getElementById("newbalanceOrig").value,
            ),
            oldbalanceDest: Number(
              document.getElementById("oldbalanceDest").value,
            ),
            newbalanceDest: Number(
              document.getElementById("newbalanceDest").value,
            ),
          };

          const res = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json();

          const box = document.getElementById("singleRes");

          box.classList.add("show");

          box.innerHTML = `
            <div>
              <h3>Result</h3>
              <p><strong>Label:</strong> ${data.label}</p>
              <p><strong>Fraud probability:</strong> ${data.probability}%</p>
            </div>
          `;
        };
      </script>
      <script>
        document.getElementById("batchForm").onsubmit = async (e) => {
          e.preventDefault();

          const fileInput = document.getElementById("csvFile");

          if (!fileInput.files.length) {
            alert("Please select a CSV file");
            return;
          }

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          document.getElementById("batchRes").innerText = "Processing...";

          try {
            const res = await fetch("/predict/batch", {
              method: "POST",
              body: formData,
            });

            const data = await res.json();

            const box = document.getElementById("batchRes");

            box.classList.add("show");

            box.innerHTML = `
              <h3>Batch Results:</h3>
              ${data.results
                .map(
                  (r, i) => `
                <div style="padding:8px; border-bottom:1px solid #eee;">
                <h3>Result #${i + 1}</h3>
                <p><strong>Label:</strong> ${r.label}</p>
                <p><strong>Fraud probability:</strong> ${r.probability}%</p>
                </div>
  `,
                )
                .join("")}
`;
          } catch (err) {
            document.getElementById("batchRes").innerText =
              "Error: " + err.message;
          }
        };
      </script>
    </div>
  </body>
</html>
