<!doctype html>
<html>
  <link rel="stylesheet" href="css/styles.css" />
  <head>
    <title>FDIS API Test</title>
  </head>
  <body>
    <h1>Fraud Detection API Test</h1>

    <h3>Single Transaction</h3>
    <form id="singleForm">
      Step: <input type="number" id="step" value="1" /><br />
      Type:
      <select id="type">
        <option value="PAYMENT">PAYMENT</option>
        <option value="TRANSFER">TRANSFER</option>
        <option value="CASH_OUT">CASH_OUT</option>
        <option value="DEBIT">DEBIT</option>
        <option value="CASH_IN">CASH_IN</option></select
      ><br />
      Amount:
      <input type="number" step="0.01" id="amount" value="1000.0" /><br />
      OldBalanceOrg:
      <input
        type="number"
        step="0.01"
        id="oldbalanceOrg"
        value="1000.0"
      /><br />
      NewBalanceOrig:
      <input type="number" step="0.01" id="newbalanceOrig" value="0.0" /><br />
      OldBalanceDest:
      <input type="number" step="0.01" id="oldbalanceDest" value="0.0" /><br />
      NewBalanceDest:
      <input
        type="number"
        step="0.01"
        id="newbalanceDest"
        value="0.0"
      /><br /><br />
      <button type="submit">Predict Single</button>
    </form>
    <pre id="singleRes" style="background: #eee; padding: 10px"></pre>

    <hr />

    <h3>Batch Predict (CSV)</h3>
    <form id="batchForm">
      <input type="file" id="csvFile" accept=".csv" required /><br /><br />
      <button type="submit">Predict Batch</button>
    </form>
    <pre id="batchRes" style="background: #eee; padding: 10px"></pre>

    <script>
      document.getElementById("singleForm").onsubmit = async (e) => {
        e.preventDefault();
        document.getElementById("singleRes").innerText = "Processing...";
        const payload = {
          step: parseInt(document.getElementById("step").value),
          type: document.getElementById("type").value,
          amount: parseFloat(document.getElementById("amount").value),
          oldbalanceOrg: parseFloat(
            document.getElementById("oldbalanceOrg").value,
          ),
          newbalanceOrig: parseFloat(
            document.getElementById("newbalanceOrig").value,
          ),
          oldbalanceDest: parseFloat(
            document.getElementById("oldbalanceDest").value,
          ),
          newbalanceDest: parseFloat(
            document.getElementById("newbalanceDest").value,
          ),
        };
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        document.getElementById("singleRes").innerText = JSON.stringify(
          await res.json(),
          null,
          2,
        );
      };

      document.getElementById("batchForm").onsubmit = async (e) => {
        e.preventDefault();
        document.getElementById("batchRes").innerText = "Processing...";
        const formData = new FormData();
        formData.append("file", document.getElementById("csvFile").files[0]);
        const res = await fetch("/predict/batch", {
          method: "POST",
          body: formData,
        });
        document.getElementById("batchRes").innerText = JSON.stringify(
          await res.json(),
          null,
          2,
        );
      };
    </script>
  </body>
</html>
