<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/normalize.css" />
    <title>Transaction history</title>
  </head>
  <body>
    <div id="navbar"></div>

    <script>
      async function loadNavbar() {
        const res = await fetch("/static/components/navbar.html");
        document.getElementById("navbar").innerHTML = await res.text();
      }

      loadNavbar();
    </script>

    <div id="tableContainer"></div>

    <script>
      async function loadTable() {
        const res = await fetch("/static/components/table.html");
        document.getElementById("tableContainer").innerHTML = await res.text();

        loadData();

        async function loadData() {
          const res = await fetch("/transactions");
          const data = await res.json();

          const tbody = document.getElementById("transactionsBody");

          tbody.innerHTML = data
            .map(
              (t) => `
    <tr>
      <td>${t.id}</td>
      <td>${t.type}</td>
      <td>${t.amount}</td>
      <td>${t.prediction ?? "—"}</td>
      <td>${t.probability ?? "—"}</td>
    </tr>
  `,
            )
            .join("");
        }
      }

      loadTable();
    </script>
  </body>
</html>
