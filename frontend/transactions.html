<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <title>Transaction History</title>
  </head>

  <div id="navbar"></div>

  <script>
    async function loadNavbar() {
      const res = await fetch("/static/components/navbar.html");
      const html = await res.text();

      document.getElementById("navbar").innerHTML = html;
    }

    loadNavbar();
  </script>

  <body>
    <div class="page-container">
      <div class="card">
        <div class="filters">
          <div class="filter-group">
            <span class="filter-label">Type</span>
            <div class="filter-buttons" data-filter="type">
              <button class="chip active" data-value="">All</button>
              <button class="chip" data-value="PAYMENT">Payment</button>
              <button class="chip" data-value="TRANSFER">Transfer</button>
              <button class="chip" data-value="CASH_OUT">Cash Out</button>
            </div>
          </div>

          <div class="filter-group">
            <span class="filter-label">Fraud</span>
            <div class="filter-buttons" data-filter="fraud">
              <button class="chip active" data-value="">All</button>
              <button class="chip" data-value="true">Fraud</button>
              <button class="chip" data-value="false">Safe</button>
            </div>
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Prediction</th>
              <th>Probability</th>
            </tr>
          </thead>
          <tbody id="transactionsBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      let filters = {
        type: "",
        fraud: "",
      };

      document.addEventListener("click", (e) => {
        if (!e.target.classList.contains("chip")) return;

        const parent = e.target.closest(".filter-buttons");
        if (!parent) return;

        const key = parent.dataset.filter;
        const value = e.target.dataset.value;

        filters[key] = value;

        parent
          .querySelectorAll(".chip")
          .forEach((b) => b.classList.remove("active"));

        e.target.classList.add("active");

        loadTransactions();
      });

      async function loadTransactions() {
        let url = "/transactions";
        const params = [];

        if (filters.type) params.push(`type=${filters.type}`);
        if (filters.fraud !== "")
          params.push(`is_fraud=${filters.fraud === "true"}`);

        if (params.length) url += "?" + params.join("&");

        const res = await fetch(url);
        const data = await res.json();

        const tbody = document.getElementById("transactionsBody");

        if (!data || data.length === 0) {
          tbody.innerHTML = `
            <tr class="empty-row">
              <td colspan="5">No transactions found</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = data
          .map(
            (t) => `
          <tr class="${t.prediction === 1 ? "fraud-row" : ""}">
            <td>${t.id}</td>
            <td>${t.type}</td>
            <td>${t.amount}</td>
            <td>${t.prediction ?? "—"}</td>
            <td>${t.probability ?? "—"}</td>
          </tr>
        `,
          )
          .join("");
      }

      function resetFilters() {
        filters = { type: "", fraud: "" };

        document.querySelectorAll(".filter-buttons").forEach((group) => {
          group.querySelectorAll(".chip").forEach((b) => {
            b.classList.toggle("active", b.dataset.value === "");
          });
        });

        loadTransactions();
      }

      loadTransactions();
    </script>
  </body>
</html>
