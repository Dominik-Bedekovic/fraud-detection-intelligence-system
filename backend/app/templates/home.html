<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form method="post">
      <label for="step">Step</label>
      <input type="text" name="step" value="1" />
      <br />
      <label for="type">Type</label>
      <input type="text" name="type" value="TRANSFER" />
      <br />
      <label for="amount">Amount</label>
      <input type="text" name="amount" value="500000" />
      <br />
      <label for="oldBalanceOrig">Old Balance Original</label>
      <input type="text" name="oldBalanceOrig" value="500000" />
      <br />
      <label for="newBalanceOrig">New Balance Original</label>
      <input type="text" name="newBalanceOrig" value="0" />
      <br />
      <label for="oldBalanceDest">Old Balance Destination</label>
      <input type="text" name="oldBalanceDest" value="0" />
      <br />
      <label for="newBalanceDest">New Balance Destination</label>
      <input type="text" name="newBalanceDest" value="0" />
      <br />
      <input type="submit" value="Submit" />
    </form>

    <form method="post" enctype="multipart/form-data">
      <label for="file">Choose a file to upload</label>
      <input type="file" name="file" id="file" accept=".csv" />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
